id: mochi
name: Mochi
tagline: Adapts web content for readers with dyslexia, ADHD, and reading disabilities
summary: Mochi rewrites and reformats page content on device so that dense text becomes easier to
  read for people with reading differences.
problem: Long-form web content is hard to process for many readers and rarely offers an adapted view.
solution: The extension restructures text locally with Chrome's built-in AI, so nothing leaves the browser.
