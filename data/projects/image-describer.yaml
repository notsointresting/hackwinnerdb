id: image-describer
name: Image Describer
tagline: Chrome extension that describes web images for blind and low-vision users
summary: A browser extension that generates descriptions of images on any page and announces them as text and audio,
  using Gemini vision models.
problem: Most images on the web still ship without usable alternative text.
solution: Descriptions are generated on demand in the browser rather than depending on site authors.
