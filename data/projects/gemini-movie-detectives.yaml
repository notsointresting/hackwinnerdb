id: gemini-movie-detectives
name: Gemini Movie Detectives
tagline: AI movie quiz game built on Gemini and retrieval-augmented generation
summary: A quiz game that generates movie trivia on the fly by combining Gemini with retrieval over
  a movie database, aimed at classroom and university use.
problem: Educational quiz content is slow to author and goes stale quickly.
solution: Questions are generated per session from live movie data, so the content never repeats.
