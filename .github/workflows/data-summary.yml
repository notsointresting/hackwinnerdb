name: Data change summary

on:
  pull_request:
    paths:
      - "data/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # GITHUB_STEP_SUMMARY is a different file for every step, so the comment
      # step below cannot read what this one wrote. Keep our own copy.
      - name: Build summary
        id: summary
        run: |
          npx tsx scripts/data-summary.ts "origin/${{ github.base_ref }}" > data-summary.md
          cat data-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const body = fs.readFileSync("data-summary.md", "utf8").trim();
            if (!body) {
              core.info("No data change summary to post.");
              return;
            }
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
